<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --bg:#0e0e0e;
  --surface:#161616;
  --border:#252525;
  --border-hi:#383838;
  --text:#e8e8e4;
  --dim:#606060;
  --mid:#909090;
  --accent:#c8b89a;
  --accent-lo:#6b5e4a;
  --r:0.375rem;
}

html,body{
  width:100%;height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:'DM Mono',monospace;
  font-weight:300;
  overflow:hidden;
  touch-action:manipulation;
}

#app{
  position:fixed;inset:0;
  display:flex;
  flex-direction:column;
  align-items:stretch;
}

#center{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:2rem 1.5rem;
  gap:0;
  width:100%;
}

/* tabs */
#tabs{
  display:flex;
  border:1px solid var(--border);
  border-radius:var(--r);
  overflow:hidden;
  margin-bottom:3rem;
}
.tab{
  background:none;border:none;
  color:var(--dim);
  font-family:'DM Mono',monospace;
  font-size:0.62rem;font-weight:400;
  letter-spacing:0.12em;text-transform:uppercase;
  padding:0.5rem 1.3rem;
  cursor:pointer;transition:all 0.2s;
  border-right:1px solid var(--border);
}
.tab:last-child{border-right:none}
.tab.active{background:var(--surface);color:var(--text)}

/* clock */
#clock-wrap{
  position:relative;
  width:min(260px,70vw);height:min(260px,70vw);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
#ring-svg{position:absolute;inset:0;width:100%;height:100%}

#time-center{
  position:relative;z-index:2;
  text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:0.35rem;
}
#time-num{
  font-family:'DM Serif Display',serif;
  font-size:clamp(2.8rem,11vw,4.2rem);
  letter-spacing:-0.025em;line-height:1;
  color:var(--text);transition:color 0.5s;
}
#time-phase{
  font-size:0.58rem;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--dim);
}

/* controls */
#controls{
  display:flex;align-items:center;gap:1.8rem;
  margin-top:2.5rem;
}
.ic{
  background:none;border:none;
  color:var(--dim);cursor:pointer;
  padding:0.5rem;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:color 0.2s,transform 0.2s;
}
.ic:hover,.ic:active{color:var(--text);transform:scale(1.1)}
.ic svg{width:18px;height:18px;fill:currentColor}

#play-btn{
  width:54px;height:54px;
  border:1px solid var(--border-hi);border-radius:50%;
  background:none;color:var(--text);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.22s;flex-shrink:0;
}
#play-btn:hover,#play-btn:active{background:var(--text);color:var(--bg);border-color:var(--text)}
#play-btn svg{width:22px;height:22px;fill:currentColor}

/* flow stop */
#stop-flow{
  display:none;
  align-items:center;gap:0.45rem;
  background:none;
  border:1px solid var(--border);
  border-radius:var(--r);
  color:var(--dim);
  font-family:'DM Mono',monospace;
  font-size:0.58rem;letter-spacing:0.14em;text-transform:uppercase;
  padding:0.5rem 1.1rem;
  cursor:pointer;margin-top:1.6rem;
  transition:all 0.25s;
}
#stop-flow.on{display:flex}
#stop-flow:hover,#stop-flow:active{border-color:var(--accent-lo);color:var(--accent)}
#stop-flow svg{width:11px;height:11px;fill:currentColor}

/* settings */
#srow{
  display:flex;align-items:center;gap:1.6rem;
  margin-top:1.4rem;
  transition:opacity 0.3s;
}
#srow.off{opacity:0;pointer-events:none}
.sv{display:flex;align-items:center;gap:0.4rem;font-size:0.58rem;letter-spacing:0.08em;color:var(--dim)}
.sv-n{color:var(--mid);min-width:1.1rem;text-align:center}
.sv button{background:none;border:none;color:var(--dim);font-size:0.85rem;cursor:pointer;padding:0 2px;line-height:1;transition:color 0.2s}
.sv button:hover{color:var(--text)}
.sd{width:1px;height:14px;background:var(--border)}

/* pips */
#pips{display:flex;gap:5px;margin-top:1.4rem;min-height:5px}
.pip{width:5px;height:5px;border-radius:50%;background:var(--border-hi);transition:all 0.3s}
.pip.done{background:var(--accent-lo)}
.pip.cur{background:var(--accent);transform:scale(1.25)}

/* bottom */
#bot{
  display:flex;align-items:center;justify-content:space-between;
  padding:0.8rem 1.4rem;
  border-top:1px solid var(--border);
  padding-bottom:calc(0.8rem + env(safe-area-inset-bottom,0px));
  flex-shrink:0;width:100%;
}
#sess-lbl{font-size:0.56rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--dim)}

/* break overlay */
#brk{
  position:fixed;inset:0;z-index:30;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0.4rem;padding:2rem;
  opacity:0;pointer-events:none;transition:opacity 0.55s;
}
#brk.on{opacity:1;pointer-events:all}
#brk-lbl{font-size:0.56rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--dim);margin-bottom:0.4rem}
#brk-time{
  font-family:'DM Serif Display',serif;
  font-size:clamp(4rem,18vw,5.5rem);
  letter-spacing:-0.03em;line-height:1;color:var(--accent);
}
#brk-desc{font-size:0.62rem;color:var(--dim);letter-spacing:0.08em;margin-top:0.2rem;text-align:center}
#brk-skip{
  margin-top:2rem;
  background:none;border:1px solid var(--border);border-radius:var(--r);
  color:var(--dim);font-family:'DM Mono',monospace;
  font-size:0.56rem;letter-spacing:0.14em;text-transform:uppercase;
  padding:0.45rem 1.3rem;cursor:pointer;transition:all 0.22s;
}
#brk-skip:hover{border-color:var(--border-hi);color:var(--text)}

/* toast */
#toast{
  position:fixed;bottom:4.5rem;left:50%;
  transform:translateX(-50%) translateY(6px);
  background:var(--surface);border:1px solid var(--border-hi);
  color:var(--mid);font-size:0.58rem;letter-spacing:0.1em;text-transform:uppercase;
  padding:0.45rem 1.1rem;border-radius:var(--r);
  opacity:0;transition:all 0.35s;white-space:nowrap;
  pointer-events:none;z-index:50;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes breathe{0%,100%{stroke-opacity:0.5}50%{stroke-opacity:0.18}}
#pulse{animation:breathe 3.5s ease-in-out infinite}
</style>
</head>
<body>
<div id="app">
  <div id="center">

    <div id="tabs">
      <button class="tab active" data-mode="pomodoro">Pomodoro</button>
      <button class="tab" data-mode="flow">Flow</button>
    </div>

    <div id="clock-wrap">
      <svg id="ring-svg" viewBox="0 0 260 260">
        <circle cx="130" cy="130" r="114" fill="none" stroke="#1c1c1c" stroke-width="2"/>
        <circle id="pulse" cx="130" cy="130" r="122" fill="none" stroke="#2a2a2a" stroke-width="1" opacity="0"/>
        <circle id="arc" cx="130" cy="130" r="114"
          fill="none" stroke="#c8b89a" stroke-width="1.5" stroke-linecap="round"
          stroke-dasharray="716.28" stroke-dashoffset="716.28"
          transform="rotate(-90 130 130)"
          style="transition:stroke-dashoffset 1s linear,stroke 0.6s"/>
      </svg>
      <div id="time-center">
        <div id="time-num">25:00</div>
        <div id="time-phase">focus</div>
      </div>
    </div>

    <button id="stop-flow">
      <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
      end session
    </button>

    <div id="controls">
      <button class="ic" id="rst-btn">
        <svg viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
      </button>
      <button id="play-btn">
        <svg id="ip" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="ipa" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="ic" id="snd-btn">
        <svg id="son" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        <svg id="soff" viewBox="0 0 24 24" style="display:none"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
      </button>
    </div>

    <div id="srow">
      <div class="sv">
        <span>focus</span>
        <button onclick="adj('focus',-5)">−</button>
        <span class="sv-n" id="sv-focus">25</span>
        <button onclick="adj('focus',5)">+</button>
        <span>min</span>
      </div>
      <div class="sd"></div>
      <div class="sv">
        <span>break</span>
        <button onclick="adj('short',-1)">−</button>
        <span class="sv-n" id="sv-short">5</span>
        <button onclick="adj('short',1)">+</button>
      </div>
      <div class="sd"></div>
      <div class="sv">
        <span>long</span>
        <button onclick="adj('long',-5)">−</button>
        <span class="sv-n" id="sv-long">15</span>
        <button onclick="adj('long',5)">+</button>
      </div>
    </div>

    <div id="pips"></div>
  </div>

  <div id="bot">
    <div id="sess-lbl">—</div>
    <button class="ic" id="fs-btn">
      <svg viewBox="0 0 24 24"><path d="M3 3h6v2H5v4H3zm12 0h6v6h-2V5h-4zM3 15h2v4h4v2H3zm16 4h-4v2h6v-6h-2z"/></svg>
    </button>
  </div>
</div>

<div id="brk">
  <div id="brk-lbl">rest</div>
  <div id="brk-time">0:00</div>
  <div id="brk-desc"></div>
  <button id="brk-skip">skip</button>
</div>

<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);

const S={
  mode:'pomodoro',running:false,sound:true,
  phase:'focus',
  secs:25*60,total:25*60,
  flowSecs:0,
  pomos:0,sessions:0,
  bSecs:0,
  cfg:{focus:25,short:5,long:15},
};

const fmt=s=>`${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
const circ=2*Math.PI*114;

function setArc(f){$('arc').style.strokeDashoffset=circ-f*circ}

function toast(msg,d=3000){
  const t=$('toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('on'),d);
}

function buildPips(){
  const p=$('pips');p.innerHTML='';
  for(let i=0;i<4;i++){
    const d=document.createElement('div');d.className='pip';
    const idx=S.pomos%4;
    if(i<idx)d.classList.add('done');
    if(i===idx)d.classList.add('cur');
    p.appendChild(d);
  }
}

function updSess(){
  const w=['one','two','three','four','five','six','seven','eight','nine','ten'];
  $('sess-lbl').textContent=S.sessions===0?'—':`session ${w[S.sessions-1]||S.sessions}`;
}

let ac=null;
const getAC=()=>ac||(ac=new(window.AudioContext||window.webkitAudioContext)());
function chime(up=true){
  if(!S.sound)return;
  try{
    const a=getAC();
    (up?[440,554,659,880]:[880,659,554,440]).forEach((f,i)=>setTimeout(()=>{
      const o=a.createOscillator(),g=a.createGain();
      o.connect(g);g.connect(a.destination);
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.001,a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.08,a.currentTime+0.04);
      g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.85);
      o.start();o.stop(a.currentTime+0.9);
    },i*200));
  }catch(e){}
}

let ticker=null;
function startTick(){clearInterval(ticker);ticker=setInterval(tick,1000);$('pulse').style.opacity='0.6';}
function stopTick(){clearInterval(ticker);ticker=null;$('pulse').style.opacity='0';}

function tick(){
  if(S.phase==='break'){
    S.bSecs--;$('brk-time').textContent=fmt(S.bSecs);
    if(S.bSecs<=0)endBreak();return;
  }
  if(S.mode==='pomodoro'){
    S.secs--;$('time-num').textContent=fmt(S.secs);
    setArc(1-S.secs/S.total);if(S.secs<=0)endPomo();
  } else {
    S.flowSecs++;$('time-num').textContent=fmt(S.flowSecs);
    setArc(Math.min(S.flowSecs/(90*60),1));
  }
}

function setPlaying(v){
  S.running=v;
  $('ip').style.display=v?'none':'block';
  $('ipa').style.display=v?'block':'none';
}

function togglePlay(){
  if(!ac)getAC();
  if(S.running){stopTick();setPlaying(false);}
  else{startTick();setPlaying(true);if(S.mode==='flow')$('stop-flow').classList.add('on');}
}

function fullReset(){
  stopTick();setPlaying(false);
  S.phase='focus';S.flowSecs=0;
  $('stop-flow').classList.remove('on');
  $('brk').classList.remove('on');
  if(S.mode==='pomodoro'){
    S.secs=S.cfg.focus*60;S.total=S.cfg.focus*60;
    $('time-num').textContent=fmt(S.secs);$('time-phase').textContent='focus';
  } else {
    $('time-num').textContent='0:00';$('time-phase').textContent='flow';
  }
  setArc(0);$('arc').style.stroke='#c8b89a';
}

function endPomo(){
  stopTick();setPlaying(false);S.pomos++;S.sessions++;updSess();buildPips();chime(false);
  const long=S.pomos%4===0;
  beginBreak((long?S.cfg.long:S.cfg.short)*60,long?'long break':'short break');
}

function endFlow(){
  if(S.flowSecs===0&&!S.running)return;
  stopTick();setPlaying(false);$('stop-flow').classList.remove('on');
  S.sessions++;updSess();chime(false);
  const bSecs=Math.min(Math.max(Math.round(S.flowSecs/5),60),30*60);
  const desc=`${fmt(S.flowSecs)} focused — ${fmt(bSecs)} rest`;
  S.flowSecs=0;beginBreak(bSecs,desc);
}

function beginBreak(secs,label){
  S.phase='break';S.bSecs=secs;
  $('brk-time').textContent=fmt(secs);$('brk-desc').textContent=label;
  $('brk').classList.add('on');startTick();
  if('Notification' in window&&Notification.permission==='granted')
    new Notification('Flow',{body:`Rest — ${fmt(secs)}`,silent:true});
}

function endBreak(){
  stopTick();$('brk').classList.remove('on');
  S.phase='focus';setPlaying(false);chime(true);$('pulse').style.opacity='0';
  if(S.mode==='pomodoro'){S.secs=S.cfg.focus*60;S.total=S.cfg.focus*60;$('time-num').textContent=fmt(S.secs);setArc(0);}
  else{$('time-num').textContent='0:00';setArc(0);}
  toast('focus time');
}

function adj(k,d){
  if(S.running)return;
  const b={focus:[5,90],short:[1,20],long:[5,60]};
  const[mn,mx]=b[k];S.cfg[k]=Math.min(mx,Math.max(mn,S.cfg[k]+d));
  $({'focus':'sv-focus',short:'sv-short',long:'sv-long'}[k]).textContent=S.cfg[k];
  if(k==='focus'&&S.phase==='focus'&&!S.running&&S.mode==='pomodoro'){
    S.secs=S.cfg.focus*60;S.total=S.cfg.focus*60;$('time-num').textContent=fmt(S.secs);setArc(0);
  }
}

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  if(S.running)return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');S.mode=b.dataset.mode;
  $('stop-flow').classList.remove('on');
  const flow=S.mode==='flow';
  $('srow').classList.toggle('off',flow);
  $('pips').style.visibility=flow?'hidden':'visible';
  $('time-phase').textContent=flow?'flow':'focus';
  fullReset();
}));

$('play-btn').addEventListener('click',togglePlay);
$('rst-btn').addEventListener('click',()=>{fullReset();S.pomos=0;S.sessions=0;updSess();buildPips();});
$('stop-flow').addEventListener('click',endFlow);
$('brk-skip').addEventListener('click',()=>{S.bSecs=0;endBreak();});

$('snd-btn').addEventListener('click',()=>{
  S.sound=!S.sound;
  $('son').style.display=S.sound?'block':'none';
  $('soff').style.display=S.sound?'none':'block';
  if(S.sound)chime(true);
});

$('fs-btn').addEventListener('click',()=>{
  const el=document.documentElement;
  const inFS=document.fullscreenElement||document.webkitFullscreenElement;
  if(!inFS){(el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen)?.call(el);}
  else{(document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen)?.call(document);}
});

document.addEventListener('keydown',e=>{
  if(['INPUT','BUTTON','SELECT'].includes(e.target.tagName))return;
  if(e.key===' '){e.preventDefault();togglePlay();}
  if(e.key==='r')$('rst-btn').click();
  if(e.key==='f')$('fs-btn').click();
  if(e.key==='Escape'&&S.mode==='flow'&&S.running)endFlow();
});

if('Notification' in window&&Notification.permission==='default')
  setTimeout(()=>Notification.requestPermission(),2000);

buildPips();updSess();setArc(0);
</script>
</body>
</html>
